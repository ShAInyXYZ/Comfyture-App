# Comfyture's website on GitHub Pages, at https://shainyxyz.github.io/Comfyture-App/: www/ at the root, and the live demo without a
# server (`npm run demo-site`, every product open on its example) under demo/ when it is asked for. It runs on the public repo only
# (Comfyture-App; the private working repo has no Pages), on each push to main that changes www/ or this file, or by hand
# (Actions → Pages → Run workflow, with "demo" ticked to build the demo too). Until a demo is built, demo/ says it is coming.
name: Pages

on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Build the live demo into demo/ (needs the examples in the repo)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ShAInyXYZ/Comfyture-App'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cp -r www _site && rm -f _site/README.md
      # the demo: the free edits its pages show are made with ffmpeg, and the build plays every page in a headless browser
      - if: inputs.demo
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: inputs.demo
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm ci
          npm install --no-save playwright@1.64.0 && npx playwright install --with-deps chromium
          npm run demo-site _site/demo
      - if: ${{ !inputs.demo }}
        run: |
          mkdir -p _site/demo
          cat > _site/demo/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Comfyture demo</title><link rel="icon" href="../brand/favicon.svg"><link rel="stylesheet" href="../site.css"></head>
          <body style="display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center">
          <main style="max-width:34rem"><h1>The live demo is coming</h1>
          <p>Every studio will open here on its example. Meanwhile Comfyture runs on your machine in five minutes, with no key:
          see <a href="https://github.com/ShAInyXYZ/Comfyture-App/blob/main/docs/competition/JUDGES.md">For judges</a>.</p>
          <p><a href="../">Back to the website</a> · <a href="https://github.com/ShAInyXYZ/Comfyture-App">The code on GitHub</a></p></main>
          </body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
